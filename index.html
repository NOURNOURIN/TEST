            align-items: center;

            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;

            background-color: #c1272d; /* Rouge Maroc */

            margin-top: 15px;
        }

<body>

    <div class="container">
        <h1>Marhaban ! 🇲🇦</h1>
